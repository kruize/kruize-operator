apiVersion: kruize.io/v1alpha1
kind: Kruize
metadata:
  labels:
    app.kubernetes.io/name: kruize-operator
    app.kubernetes.io/managed-by: kustomize
  name: kruize-sample
spec:
  # Supported values: "openshift", "minikube", "kind"
  cluster_type: "openshift"
  autotune_image: "quay.io/kruize/autotune_operator:0.11"
  autotune_ui_image: "quay.io/kruize/kruize-ui:0.1.0"
  optimizer_image: "quay.io/kruize/kruize-optimizer:0.0.1"
  # For OpenShift, use: "openshift-tuning", Minikube/KIND, use: "monitoring"
  namespace: "openshift-tuning"
  
  # Optional: Resource configuration for Kruize components
  # If not specified, default values will be used
  # Persistent Volume configuration
  persistentVolume:
    name: "kruize-db-pv-volume"
    storageClassName: "manual"
    capacity:
      storage: "500Mi"
    accessModes:
      - "ReadWriteMany"
    hostPath:
      path: "/mnt/data"
    labels:
      type: "local"
      app: "kruize-db"
  
  # Persistent Volume Claim configuration
  persistentVolumeClaim:
    name: "kruize-db-pv-claim"
    storageClassName: "manual"
    accessModes:
      - "ReadWriteMany"
    resources:
      requests:
        storage: "500Mi"
    labels:
      app: "kruize-db"
  
  # Database resource configuration
  kruize-db:
    resources:
      requests:
        memory: "100Mi"
        cpu: "0.5"
      limits:
        memory: "100Mi"
        cpu: "0.5"
    
    # Volume mount configuration (container-level)
    volumeMounts:
      - name: "kruize-db-storage"
        mountPath: "/var/lib/pgsql/data"
    
    # Volume configuration (pod-level)
    volumes:
      - name: "kruize-db-storage"
        persistentVolumeClaim:
          claimName: "kruize-db-pv-claim"
  
  # Kruize application resource configuration
  kruize:
    resources:
      requests:
        memory: "768Mi"
        cpu: "0.7"
      limits:
        memory: "768Mi"
        cpu: "0.7"

  # Optimizer configuration
  # All fields are optional. If not specified, defaults will be used.
  optimizer:
    # URL for Kruize service (default: "http://kruize:8080")
    kruizeURL: "http://kruize:8080"
    # Interval for refreshing Kruize state (default: "60m")
    stateRefreshInterval: "60m"
    # Interval for bulk scheduler (default: "15m")
    bulkSchedulerInterval: "15m"
    # Startup delay for bulk scheduler (default: "1m")
    bulkSchedulerStartupDelay: "1m"
    # Duration for bulk measurements (default: "15min")
    bulkMeasurementDuration: "15min"
    # Webhook URL for Kruize Optimizer (default: "http://kruize-optimizer:8080/webhook")
    webhookURL: "http://kruize-optimizer:8080/webhook"
    # Maximum number of target labels (default: 1)
    targetLabelLimit: 1
    # Target labels for filtering (default: {"kruize/autotune": "enabled"})
    targetLabels:
      kruize/autotune: "enabled"
    # Default datasource name (default: computed from cluster_type)
    # OpenShift uses "thanos-1", Minikube/KIND use "prometheus-1"
    defaultDatasource: "prometheus-1"
    # Default metadata profile name (default: "cluster-metadata-local-monitoring")
    defaultMetadataProfile: "cluster-metadata-local-monitoring"
    # Default metric profile name (default: "resource-optimization-local-monitoring")
    defaultMetricProfile: "resource-optimization-local-monitoring"
